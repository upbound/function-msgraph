---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: inputs.msgraph.fn.crossplane.io
spec:
  group: msgraph.fn.crossplane.io
  names:
    categories:
    - crossplane
    kind: Input
    listKind: InputList
    plural: inputs
    singular: input
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Input can be used to provide input to this Function.
        properties:
          activeAccount:
            description: |-
              ActiveAccount restricts UserValidation results to users whose Entra ID
              accountEnabled attribute is true. Disabled users, and users for which
              Microsoft Graph returns no accountEnabled value, are omitted from the
              result written to the target.
              If false or unset, users are validated on existence alone.
              Only applies to the UserValidation query type.
            type: boolean
          additionalFields:
            description: |-
              AdditionalFields is a list of extra Microsoft Graph fields to include in query results.
              Supported for: UserValidation, GroupObjectIDs, ServicePrincipalDetails, GroupMembership.
              Fields are appended to the default set for each query type, e.g.:
                UserValidation default:          id, displayName, userPrincipalName, mail
                GroupObjectIDs default:          id, displayName, description
                ServicePrincipalDetails default: id, appId, displayName, description
                GroupMembership default:         id, displayName, type, mail, userPrincipalName, appId
            items:
              type: string
            type: array
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          failOnEmpty:
            description: |-
              FailOnEmpty controls whether the function should fail when input lists are empty.
              If true, the function will error on empty input lists.
              If false or unset, empty lists are valid and will result in an empty list at the target.
            type: boolean
          group:
            description: Group is a single group name for group membership queries
            type: string
          groupRef:
            description: |-
              GroupRef is a reference to retrieve the group name (e.g., from status or context)
              Overrides Group field if used
            type: string
          groups:
            description: Groups is a list of group names for group object ID queries
            items:
              type: string
            type: array
          groupsRef:
            description: |-
              GroupsRef is a reference to retrieve the group names (e.g., from status or context)
              Overrides Groups field if used
            type: string
          identity:
            description: Identity defines the type of identity used for authentication
              to the Microsoft Graph API.
            properties:
              type:
                description: Type of credentials used to authenticate to the Microsoft
                  Graph API.
                type: string
            required:
            - type
            type: object
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          queryInterval:
            description: |-
              QueryInterval is an optional minimum interval between queries, expressed as
              a Go duration string (for example "10m", "1h" or "90s"). When set, the
              function records the timestamp of its last successful query alongside the
              result stored at the status target and skips querying Microsoft Graph again
              until the interval has elapsed, regardless of how frequently the Composition
              reconciles. This helps avoid Microsoft Graph API throttling.

              Only effective in Composition mode with a "status." target, because it
              relies on reading the persisted timestamp back from the XR status on
              subsequent reconciles. Leave empty to disable interval limiting (the default).
            type: string
          queryType:
            description: |-
              QueryType defines the type of Microsoft Graph API query to perform
              Supported values: UserValidation, GroupMembership, GroupObjectIDs, ServicePrincipalDetails
            type: string
          servicePrincipals:
            description: ServicePrincipals is a list of service principal names
            items:
              type: string
            type: array
          servicePrincipalsRef:
            description: |-
              ServicePrincipalsRef is a reference to retrieve the service principal names (e.g., from status or context)
              Overrides ServicePrincipals field if used
            type: string
          skipQueryWhenTargetHasData:
            description: |-
              SkipQueryWhenTargetHasData controls whether to skip the query when the target already has data
              Default is false to ensure continuous reconciliation
            type: boolean
          target:
            description: Target where to store the Query Result
            type: string
          users:
            description: Users is a list of userPrincipalName (email IDs) for user
              validation
            items:
              type: string
            type: array
          usersRef:
            description: |-
              UsersRef is a reference to retrieve the user names (e.g., from status or context)
              Overrides Users field if used
            type: string
        required:
        - queryType
        - target
        type: object
    served: true
    storage: true
